version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Correctness
    - govet        # Run the Go vet analyzers; catch invalid constructs and suspicious code.
    - staticcheck  # Find correctness issues and common concurrency, API, and logic bugs.
    - errcheck     # Require explicit handling of returned errors.
    - errorlint    # Enforce correct error wrapping and inspection semantics.
    - bodyclose    # Ensure HTTP response bodies are closed on all paths.
    - nilerr       # Catch cases where an error is checked but nil is returned instead.

    # Dead code and redundant operations
    - ineffassign  # Catch assignments whose values are never subsequently used.
    - unused       # Catch unused declarations and other unreachable code.
    - unconvert    # Catch conversions that do not change the resulting type.

    # Code quality
    - gocritic     # Catch suspicious constructs and common implementation mistakes.
    - copyloopvar  # Catch loop-variable captures that can lead to incorrect behavior.
    - perfsprint   # Catch avoidable formatting overhead in string construction.

    # Idiomatic style and documentation
    - revive       # Enforce Go initialisms, doc structure, and clean error flow.
    - godot        # Ensure top-level declarations and doc comments end with a period.

  settings:
    errcheck:      
      exclude-functions:
        # Deferred SQL cleanup
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback

        # Intentionally ignored output
        - fmt.Fprintf(os.Stdout)
        - fmt.Fprintf(os.Stderr)
        - fmt.Fprint(os.Stdout)
        - fmt.Fprint(os.Stderr)
        - fmt.Fprintln(os.Stdout)
        - fmt.Fprintln(os.Stderr)

    revive:
      rules:
        # Enforce canonical initialisms (ID, URL, HTTP, JSON, API, SQL)
        - name: var-naming
          severity: warning

        # Enforce lowercase error strings without trailing punctuation
        - name: error-strings
          severity: warning

        # Enforce clean guard-clause return flow without redundant else blocks
        - name: if-return
          severity: warning

    godot:
      scope: declarations
      period: true

formatters:
  enable:
    - gofumpt
    - gci
    - golines

  settings:
    gofumpt:
      module-path: github.com/ju4n97/hclapi
      extra:
        group-params: true

    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ju4n97/hclapi)
      custom-order: true

    golines:
      max-len: 130
      tab-len: 4
      shorten-comments: false
      reformat-tags: true
      chain-split-dots: true