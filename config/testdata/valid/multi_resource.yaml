# yaml-language-server: $schema=../../schema.json

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

database:
  driver: mssql
  url: ${DATABASE_URL}
  pool:
    max_open_conns: 10
    max_idle_conns: 2
    conn_max_lifetime: 30m
    conn_max_idle_time: 10m

api:
  prefix: /api
  resources:
    - name: patients
      base_path: /patients
      routes:
        - method: POST
          body:
            name: { type: string, required: true }
          query:
            sql: |
              INSERT INTO patients (name)
              VALUES (@name)
          returns: none

        - method: GET
          query:
            sql: |
              SELECT * FROM patients
          returns: many

        - method: GET
          path: /:id
          path_params:
            id: { type: int, required: true }
          query:
            procedure: dbo.GetPatient
            params:
              id: path_params.id
          returns: one

        - method: DELETE
          path: /:id
          path_params:
            id: { type: int, required: true }
          query:
            sql: |
              DELETE FROM patients
              WHERE id = @id
          returns: none

    - name: appointments
      base_path: /appointments
      routes:
        - method: POST
          body:
            patient_id: { type: int, required: true }
            scheduled_at: { type: datetime, required: true }
          query:
            procedure: dbo.CreateAppointment
            params:
              patient_id: body.patient_id
              scheduled_at: body.scheduled_at
          returns: none

        - method: GET
          path: /:id
          path_params:
            id: { type: int, required: true }
          query:
            sql: |
              SELECT id, patient_id, scheduled_at
              FROM appointments
              WHERE id = @id
          returns: one