server:
  host: 0.0.0.0
  port: 8080

database:
  driver: mssql
  url: ${DATABASE_URL}

api:
  prefix: /api
  resources:
    - name: patients
      base_path: /patients
      routes:
        - method: GET
          path: /:id
          path_params:
            id: { type: int, required: true }
          query:
            procedure: dbo.GetPatient
            params:
              id: boddy.id
          returns: one