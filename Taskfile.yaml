version: '3'

env:
  CGO_ENABLED: 0

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  cli-docs:
    desc: Generate CLI reference
    cmds: 
      - go run -tags docs ./cmd/hclapi
      - bunx prettier@latest --write docs/cli

  cli-man:
    desc: Generate man pages
    cmd: go run -tags man ./cmd/hclapi

  docs-serve:
    desc: Serve documentation
    dir: docs
    cmd: bun run dev

  docs-build:
    desc: Build documentation
    dir: docs
    cmd: bun run build

  test:
    desc: Run tests
    cmd: go test ./...

  test-race:
    desc: Run tests with race detector
    env:
      CGO_ENABLED: 1
    cmd: go test -race -count=1 -timeout=30s ./...

  test-integration:
    desc: Run containerized integration tests agains real services
    cmd: go test -v -tags=integration -run="^TestIntegration" -timeout=5m ./...

  lint:
    desc: Lint code
    cmd: golangci-lint run

  fmt:
    desc: Format code
    cmd: golangci-lint fmt

  fmt-docs:
    desc: Format docs
    cmd: bunx prettier@latest --write docs/src

  update:
    desc: Update dependencies
    cmds: 
      - go get -u ./...
      - go mod tidy

    
