server:
  host: 0.0.0.0
  port: 8080

database:
  driver: mssql
  url: ${DATABASE_URL}

api:
  prefix: /api
  resources:
    - name: patients
      base_path: /patients
      routes:
        - method: POST
          body:
            name: { type: strnig, required: true }
          query:
            sql: |
              INSERT INTO patients (name) VALUES (@name)
          returns: none