services:
  mysql:
    image: mysql:8.0
    container_name: hclapi-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hclapi_db
      MYSQL_USER: hclapi
      MYSQL_PASSWORD: hclapi_password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 10