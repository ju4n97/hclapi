services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hclapi-sqlserver-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hclapi-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: /bin/bash
    command: -c "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Password123!' -C -i /init.sql"
    volumes:
      - ./init.sql:/init.sql:ro
    restart: "no"