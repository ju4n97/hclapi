services:
  postgres:
    image: postgres:18-alpine
    container_name: hclapi-06-postgres
    environment:
      POSTGRES_USER: hclapi
      POSTGRES_PASSWORD: hclapi_password
      POSTGRES_DB: hclapi_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hclapi -d hclapi_db"]
      interval: 2s
      timeout: 3s
      retries: 10