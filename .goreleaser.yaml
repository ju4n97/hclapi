# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: hclapi

before:
  hooks:
    - go mod tidy

builds:
  - id: hclapi
    main: ./cmd/hclapi
    binary: hclapi
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=netgo,osusergo
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/version.version={{ .Version }}
      - -X {{ .ModulePath }}/internal/version.branch={{ .Branch }}
      - -X {{ .ModulePath }}/internal/version.shortCommit={{ .ShortCommit }}
      - -X {{ .ModulePath }}/internal/version.fullCommit={{ .FullCommit }}
      - -X {{ .ModulePath }}/internal/version.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md*
      - LICENSE*
      - CONTRIBUTING.md*
      - SECURITY.md*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

dockers_v2:
  - images:
      - ghcr.io/ju4n97/hclapi
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

changelog:
  sort: asc
  use: github
  abbrev: 7
  filters:
    exclude:
      - '(?i)^merge\s+'
      - '(?i)^bump\s+'
      - '(?i)^dependabot'
      - '(?i)^wip'
      - '(?i).*(lint|format|test case|tests task|make tests|shields to readme|docs deployment|rspress|vitepress).*'
  groups:
    - title: "Features and enhancements"
      regexp: '(?i)^.*(feat|implement|add|introduce|extend|enhance|export|create|integrate|allow|expose|provide|enable|propagate|watch|standardize|support|define|register|bootstrap|scaffold|setup|serve|parse|pool).*$'
      order: 1

    - title: "Bug fixes and stability"
      regexp: '(?i)^.*(fix|bug|prevent|resolve|harden|correct|patch|repair|avoid|recover|handle|check\s+for|ensure|validate|sanitize|leak|panic|crash|timeout|close).*$'
      order: 2

    - title: "Performance improvements"
      regexp: '(?i)^.*(perf|optimize|speed|fast|cache|reduce|parallel|concurrent|async|realloc|alloc|memory|latency|throughput).*$'
      order: 3

    - title: "Refactoring and maintenance"
      regexp: '(?i)^.*(refactor|improve|simplify|rework|normalize|decouple|cleanup|clean|remove|delete|deprecate|rename|move|sync|align|upgrade|update|reorganize|structure).*$'
      order: 4

    - title: "Other changes"
      order: 999